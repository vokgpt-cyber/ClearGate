# =============================================================================
# nginx.local.conf — local test profile (PC #2)
# =============================================================================
# Single-origin proxy: browser hits http://localhost, nginx routes:
#   /api/*  -> backend:8000
#   /ws/*   -> backend:8000  (with WebSocket upgrade)
#   /health -> backend:8000  (so verify-local.bat can probe through nginx)
#   /*      -> frontend:3000 (Next.js static export)
# No TLS, no cert hassle, no host file edits.
# =============================================================================

upstream cleargate_backend {
    server backend:8000;
}

upstream cleargate_frontend {
    server frontend:3000;
}

server {
    listen 80 default_server;
    server_name _;

    # Allow generous body size for DOCX uploads (up to 50 MB).
    client_max_body_size 50m;

    # Backend health-probe (used by verify-local.bat).
    location = /health {
        proxy_pass http://cleargate_backend/health;
        proxy_set_header Host $host;
    }

    # REST API.
    location /api/ {
        proxy_pass http://cleargate_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;       # LLM verify can take a while on CPU
        proxy_send_timeout 300s;
    }

    # WebSocket streaming.
    location /ws/ {
        proxy_pass http://cleargate_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;      # long-running streams
    }

    # Everything else -> Next.js frontend.
    location / {
        proxy_pass http://cleargate_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }
}
