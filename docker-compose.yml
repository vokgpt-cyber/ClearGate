# CLEARGATE Docker Compose — Alpha profile (RTX 4060)
#
# Usage:
#   docker compose up -d              # Start all services
#   docker compose logs -f backend    # Follow logs
#   docker compose down               # Stop and remove
#   docker compose down -v            # Stop and remove volumes too
#
# For MVP:
#   docker compose -f docker-compose.yml -f docker-compose.mvp.yml up -d

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cleargate-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - CLEARGATE_PROFILE=alpha
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:7b-instruct-q4_K_M
      - SPACY_MODEL=ru_core_news_lg
      - GLINER_MODEL=urchade/gliner_medium-v2.1
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    env_file:
      - path: .env
        required: false
    volumes:
      - ./backend/app:/app/app:ro
      - ./models:/app/models:ro
      - ./logs:/app/logs
    networks:
      - cleargate-net
    depends_on:
      ollama:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # mlock support for crypto memory protection
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ollama:
    # Pin to a known-good tag instead of :latest so behaviour does not
    # drift between operator boxes. Bump deliberately after a manual
    # smoke test of the new tag against the qwen2.5 model. The CPU/GPU
    # selection is automatic at runtime — same image works in both
    # modes; pilot.yml strips the GPU reservation.
    image: ollama/ollama:0.5.7
    container_name: cleargate-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - cleargate-net
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "sh", "-c", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Frontend is normally run via `npm run tauri dev` outside of Docker
  # for hot-reload and native window. The container below is for
  # web-based testing if needed.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000
    container_name: cleargate-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    networks:
      - cleargate-net
    depends_on:
      - backend
    profiles:
      - web  # only start with: docker compose --profile web up

networks:
  cleargate-net:
    driver: bridge

volumes:
  ollama-data:
    driver: local
