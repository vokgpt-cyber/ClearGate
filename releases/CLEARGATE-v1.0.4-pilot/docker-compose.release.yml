# CLEARGATE v1.0.4 pilot release override.
#
# This file is intentionally small. It locks pilot-safe runtime defaults on top
# of docker-compose.yml + docker-compose.gpu.yml without changing app code.

services:
  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_WS_URL: ""
    environment:
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_WS_URL: ""

  backend:
    build:
      args:
        SPACY_MODEL: ${SPACY_MODEL:-ru_core_news_lg}
        SPACY_MODEL_WHEEL_URL: ${SPACY_MODEL_WHEEL_URL:-https://github.com/explosion/spacy-models/releases/download/ru_core_news_lg-3.8.0/ru_core_news_lg-3.8.0-py3-none-any.whl}
    environment:
      PYTHONPATH: /app
      CLEARGATE_PROFILE: gpu
      OLLAMA_HOST: ${CLEARGATE_LLM_HOST:-http://ollama:11434}
      OLLAMA_MODEL: ${CLEARGATE_LLM_MODEL:-gemma4:26b}
      CLEARGATE_ENTITY_ENGINE: ${CLEARGATE_ENTITY_ENGINE:-classic}
      EMBEDDER_URL: http://bge-embedder:80
      CLEARGATE_DISABLE_LLM_LAYER: ${CLEARGATE_DISABLE_LLM_LAYER:-false}
      SPACY_MODEL: ${SPACY_MODEL:-ru_core_news_lg}
      GLINER_MODEL: ${GLINER_MODEL:-urchade/gliner_medium-v2.1}
      CLEARGATE_DEFAULT_GLINER_LABELS: ${CLEARGATE_DEFAULT_GLINER_LABELS:-person,address}
      BACKEND_CORS_ORIGINS: https://${CLEARGATE_DOMAIN:-cleargate.local}
      CLEARGATE_AUTH_COOKIE_SECURE: "true"
    depends_on: !override
      ollama:
        condition: service_healthy
      bge-embedder:
        condition: service_healthy

  vllm:
    profiles: !override
      - vllm
    command:
      - --model
      - ${VLLM_MODEL:-/models/gemma4}
      - --max-model-len
      - "${VLLM_MAX_MODEL_LEN:-16384}"
      - --gpu-memory-utilization
      - "${VLLM_GPU_UTIL:-0.85}"
      - --enable-prefix-caching
      - --served-model-name
      - cleargate-llm

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    profiles: !override
      - gpu
    ports: !override
      - "127.0.0.1:11434:11434"
    environment: !override
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0

  bge-embedder:
    command:
      - --model-id
      - ${EMBEDDER_MODEL:-BAAI/bge-m3}
      - --max-batch-tokens
      - "16384"
