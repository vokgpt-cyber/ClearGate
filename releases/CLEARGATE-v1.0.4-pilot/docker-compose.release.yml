# CLEARGATE v1.0.4 pilot release override.
#
# This file is intentionally small. It locks pilot-safe runtime defaults on top
# of docker-compose.yml + docker-compose.gpu.yml without changing app code.

services:
  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_WS_URL: ""
    environment:
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_WS_URL: ""

  backend:
    build:
      args:
        SPACY_MODEL: ${SPACY_MODEL:-ru_core_news_lg}
        SPACY_MODEL_WHEEL_URL: ${SPACY_MODEL_WHEEL_URL:-https://github.com/explosion/spacy-models/releases/download/ru_core_news_lg-3.8.0/ru_core_news_lg-3.8.0-py3-none-any.whl}
    environment:
      PYTHONPATH: /app
      CLEARGATE_PROFILE: gpu
      OLLAMA_HOST: http://vllm:8000/v1
      OLLAMA_MODEL: cleargate-llm
      EMBEDDER_URL: http://bge-embedder:80
      CLEARGATE_DISABLE_LLM_LAYER: ${CLEARGATE_DISABLE_LLM_LAYER:-false}
      SPACY_MODEL: ${SPACY_MODEL:-ru_core_news_lg}
      GLINER_MODEL: ${GLINER_MODEL:-urchade/gliner_medium-v2.1}
      BACKEND_CORS_ORIGINS: https://${CLEARGATE_DOMAIN:-cleargate.local}

  vllm:
    command:
      - --model
      - ${VLLM_MODEL:-Qwen/Qwen3-32B-AWQ}
      - --max-model-len
      - "${VLLM_MAX_MODEL_LEN:-16384}"
      - --gpu-memory-utilization
      - "${VLLM_GPU_UTIL:-0.85}"
      - --enable-prefix-caching
      - --enable-reasoning
      - --reasoning-parser
      - deepseek_r1
      - --served-model-name
      - cleargate-llm

  bge-embedder:
    command:
      - --model-id
      - ${EMBEDDER_MODEL:-BAAI/bge-m3}
      - --max-batch-tokens
      - "16384"
