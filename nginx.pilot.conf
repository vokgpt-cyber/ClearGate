# Nginx reverse proxy for CLEARGATE pilot deployment.
#
# Single-origin on port 80:
#   /              -> frontend container (Next.js static export)
#   /api/*         -> backend container (FastAPI REST)
#   /health, /health/ready -> backend healthcheck (used by status.bat)
#   /ws/*          -> backend container (WebSocket streaming)
#
# Same-origin for the browser means:
#   - NEXT_PUBLIC_API_URL / NEXT_PUBLIC_WS_URL can be empty (relative URLs)
#   - No CORS round-trip (browser treats /api as same origin as the page)
#   - Only one port (80) to whitelist in the Windows firewall
#
# TLS: if/when a real cert lands on the pilot VM, swap this server block
# for an HTTPS one that listens on 443 and keep the same location rules.

upstream cleargate_backend {
    server backend:8000;
    # Long timeouts because LLM calls on a CPU-only box can legitimately
    # run 30-60s. If we return 504 mid-request the user sees nothing.
    keepalive 32;
}

upstream cleargate_frontend {
    server frontend:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    # Let large DOCX uploads through. Default 1 MB limit chokes any
    # contract longer than a few pages.
    client_max_body_size 50m;

    # --- Backend REST API -----------------------------------------------
    location /api/ {
        proxy_pass http://cleargate_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM requests can be slow on CPU; don't drop them mid-flight.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;

        # Disable buffering so SSE-style responses stream to the browser.
        proxy_buffering off;
    }

    # --- Backend health (status.bat + docker healthchecks) --------------
    location = /health        { proxy_pass http://cleargate_backend/health; }
    location = /health/ready  { proxy_pass http://cleargate_backend/health/ready; }

    # --- WebSocket streaming --------------------------------------------
    location /ws/ {
        proxy_pass http://cleargate_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Keep WS connections alive for long LLM streams.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Frontend (Next.js static export served by `serve`) -------------
    location / {
        proxy_pass http://cleargate_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Short timeouts here — this is just static asset delivery.
        proxy_read_timeout 30s;
    }
}
