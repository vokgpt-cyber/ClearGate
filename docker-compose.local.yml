# =============================================================================
# CLEARGATE — local test profile (PC #2, RTX 3090, host Ollama)
# =============================================================================
# Self-contained compose file (NOT an override of docker-compose.yml).
# Designed for the simplest possible "kick-the-tyres" run on a Windows
# desktop that already has:
#   * Docker Desktop (with WSL2 backend) running
#   * Ollama installed natively on the Windows host (http://localhost:11434)
#   * At least one Russian-friendly chat model pulled (qwen2.5:7b or similar)
#
# What this profile does NOT include (on purpose, to stay simple):
#   * No vLLM container        (uses host Ollama)
#   * No BGE-M3 embedder       (pipeline auto-degrades; layers 1+2+4+5 still run)
#   * No LDAP/AD               (local admin/adminadmin login)
#   * No TLS / nginx HTTPS     (plain http://localhost)
#   * No GPU reservation       (Ollama on host already owns the GPU)
#
# Usage:
#   scripts\start-local.bat            (recommended)
# or manually:
#   docker compose -f docker-compose.local.yml up -d --build
#   docker compose -f docker-compose.local.yml logs -f
#   docker compose -f docker-compose.local.yml down
#
# After "up", open http://localhost in a browser and log in as admin/adminadmin.
# =============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cleargate-local-backend
    restart: unless-stopped
    ports:
      # Direct debug port; UI/benchmark use nginx :80. Default avoids
      # clashing with other local FastAPI apps commonly bound to 8000.
      - "${CLEARGATE_LOCAL_BACKEND_PORT:-18000}:8000"
    environment:
      - CLEARGATE_PROFILE=local
      - PYTHONPATH=/app
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      # Backend reaches host's Ollama via Docker Desktop's special DNS name.
      # OPENAI_BASE_URL is normalized internally to OLLAMA_HOST + /v1.
      - OLLAMA_HOST=http://host.docker.internal:11434
      # Pick a model the user already has. qwen2.5:7b is the usual default.
      # Override via .env.local if a different model is preferred (e.g.
      # OLLAMA_MODEL=qwen2.5:14b-instruct-q4_K_M).
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b-instruct-q4_K_M}
      # Fast local defaults: avoid multi-hundred-MB model downloads on first
      # smoke test. Override via environment for higher-quality local runs.
      - SPACY_MODEL=${SPACY_MODEL:-ru_core_news_sm}
      - GLINER_MODEL=${GLINER_MODEL:-}
      - CLEARGATE_DEFAULT_GLINER_LABELS=${CLEARGATE_DEFAULT_GLINER_LABELS:-}
      - CLEARGATE_DISABLE_LLM_LAYER=true
      # No EMBEDDER_URL set on purpose — the BGE retriever degrades gracefully
      # to whole-document context (slightly less precise, still functional).
      - LOG_LEVEL=INFO
      - LOG_FORMAT=text
      # CORS open for local browser dev convenience; cookies are same-origin
      # via nginx anyway.
      - BACKEND_CORS_ORIGINS=*
      # No LDAP_URL set => auth falls back to local password mode.
      # The admin user is seeded by scripts/start-local.bat after the
      # container becomes healthy:
      #   docker exec -i cleargate-local-backend cleargate-admin \
      #       seed --username admin --password-stdin --if-empty --admin
    volumes:
      # Local profile uses source bind-mounts so repair/dev changes do not
      # require rebuilding the large ML dependency image on every edit.
      - ./backend/app:/app/app:ro
      # Named volume so SQLite + audit log persist across restarts.
      - cleargate-local-data:/app/data
      - ./logs:/app/logs
    networks:
      - cleargate-local-net
    extra_hosts:
      # Belt-and-suspenders: works even if Docker Desktop's auto-injection
      # of host.docker.internal is somehow disabled.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.web
      args:
        # Empty values => Next.js uses RELATIVE URLs (/api/..., /ws/...).
        # nginx below proxies those to backend on the same origin.
        # If you skip nginx and want direct access on :3000, set these to
        # http://localhost:18000 / ws://localhost:18000 — but nginx is simpler.
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_WS_URL: ""
    container_name: cleargate-local-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"          # exposed for direct debug; UI uses nginx :80
    environment:
      - NEXT_PUBLIC_API_URL=
      - NEXT_PUBLIC_WS_URL=
    networks:
      - cleargate-local-net
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: cleargate-local-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - cleargate-local-net
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  cleargate-local-net:
    driver: bridge

volumes:
  cleargate-local-data:
    name: cleargate-local-data
