# CLEARGATE Docker Compose — Pilot profile (CPU-only VM, 32 GB RAM)
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.pilot.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.pilot.yml logs -f
#   docker compose -f docker-compose.yml -f docker-compose.pilot.yml down
#
# This override:
#   - Removes GPU requirements from all services
#   - Uses the full qwen2.5:7b model on CPU (same quality as dev)
#   - Sets memory limits appropriate for 32 GB VM
#   - Enables the web frontend profile by default
#   - Configures CORS for network access
#
# Note: LLM responses will take 30-60s on CPU vs 1-3s on GPU.
# Layers 1-2 (regex + NER) are instant regardless.

services:
  backend:
    # Remove GPU reservation (CPU-only VM)
    deploy:
      resources:
        reservations:
          devices: []
        limits:
          memory: 8G
        reservations:
          memory: 6G
    environment:
      - CLEARGATE_PROFILE=pilot
      - BACKEND_WORKERS=1
      - OLLAMA_MODEL=qwen2.5:7b-instruct-q4_K_M
      - SPACY_MODEL=ru_core_news_lg
      - GLINER_MODEL=urchade/gliner_medium-v2.1
      # CORS: allow connections from any machine on the network
      - BACKEND_CORS_ORIGINS=*

  ollama:
    # Remove GPU reservation (CPU-only VM)
    deploy:
      resources:
        reservations:
          devices: []
        limits:
          memory: 12G
        reservations:
          memory: 8G
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
      # CPU-only optimizations
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1

  frontend:
    profiles: []  # Remove "web" profile gate — always start
    environment:
      # These will be overridden in .env with actual server IP
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
