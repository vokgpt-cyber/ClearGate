# CLEARGATE Docker Compose — Pilot profile (CPU-only VM, 32 GB RAM)
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.pilot.yml --profile pilot up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.pilot.yml --profile pilot logs -f
#   docker compose -f docker-compose.yml -f docker-compose.pilot.yml --profile pilot down
#
# In practice, use install.bat / start.bat / stop.bat / logs.bat — they wrap
# these commands. Operators don't need to type them by hand.
#
# This override:
#   - Removes GPU requirements from all services (CPU-only VM)
#   - Uses the full qwen2.5:7b model on CPU (same quality as dev)
#   - Sets memory limits appropriate for a 32 GB VM
#   - Enables the web frontend under the "pilot" profile
#   - Adds an nginx reverse proxy on port 80 so users hit a single
#     same-origin URL (no port number, no CORS round-trip)
#   - Passes empty NEXT_PUBLIC_* so the frontend uses relative URLs
#     and inherits whichever hostname the browser used to reach it
#   - Configures CORS for cross-host browser access (still on for the
#     direct-to-backend dev/debug case on :8000)
#
# Note: LLM responses will take 30-60s on CPU vs 1-3s on GPU.
# Layers 1-2 (regex + NER) are instant regardless.

services:
  backend:
    # Remove GPU reservation (CPU-only VM)
    deploy:
      resources:
        reservations:
          devices: []
          memory: 6G
        limits:
          memory: 8G
    environment:
      - CLEARGATE_PROFILE=pilot
      - BACKEND_WORKERS=1
      - OLLAMA_MODEL=qwen2.5:7b-instruct-q4_K_M
      - SPACY_MODEL=ru_core_news_lg
      - GLINER_MODEL=urchade/gliner_medium-v2.1
      # CORS: allow connections from any machine on the network.
      # Safe because our /api/* routes don't rely on cookies.
      # Once auth lands (Sprint B.2+) this will be tightened.
      - BACKEND_CORS_ORIGINS=*

  ollama:
    # Remove GPU reservation (CPU-only VM)
    deploy:
      resources:
        reservations:
          devices: []
          memory: 8G
        limits:
          memory: 12G
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
      # CPU-only optimizations
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1

  frontend:
    # The base file has `profiles: [web]` on the frontend. Compose merges
    # profile arrays by union, so `profiles: []` here would NOT remove
    # the gate — we'd still need `--profile web`. Instead we add a new
    # profile "pilot" and the operator scripts always pass `--profile pilot`.
    # install-pilot.ps1 also writes COMPOSE_PROFILES=pilot to .env so any
    # bare "docker compose ..." command run from the repo root automatically
    # activates this profile and the frontend stays in the effective config.
    profiles:
      - pilot
    restart: unless-stopped
    # Frontend :3000 stays published for direct-access debugging. Pilot
    # users hit nginx on :80; ignore :3000 unless you are troubleshooting.
    # Wait for the backend container to be created before starting the
    # frontend. We use service_started (not service_healthy) on purpose:
    # the frontend serves static files and does not call the backend
    # during boot, so "backend container exists" is the only ordering
    # guarantee we need. service_healthy here would force the frontend
    # to wait for the backend healthcheck (which itself waits for ollama),
    # which is what made the initial "up -d" appear to skip the frontend.
    depends_on:
      backend:
        condition: service_started
    build:
      context: ./frontend
      dockerfile: Dockerfile.web
      # Empty NEXT_PUBLIC_* values mean the frontend uses RELATIVE URLs
      # (e.g. fetch("/api/sessions") instead of fetch("http://1.2.3.4:8000/api/sessions")).
      # That works because nginx serves the page and proxies /api + /ws
      # back to the backend on the same origin — no CORS, no IP baking.
      # Code in src/lib/api.ts treats unset === dev fallback to localhost
      # and "" === relative same-origin (see api.ts comments).
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL-}
    environment:
      # Kept for parity; the baked URL from build args is authoritative.
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL-}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL-}
    healthcheck:
      # `serve` is a Node static server — a TCP-level probe is enough to
      # confirm it's up. Used by status.bat to wait for readiness.
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ----------------------------------------------------------------------
  # Reverse proxy: only exists in the pilot profile.
  # Listens on TCP/80 and is the ONLY port pilot users need to reach.
  # Everything else (3000, 8000, 11434) is for operator debugging.
  # ----------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: cleargate-nginx
    profiles:
      - pilot
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.pilot.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - cleargate-net
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    healthcheck:
      # Probe the backend's /health endpoint THROUGH nginx so this also
      # validates the proxy wiring, not just nginx itself.
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
