# =============================================================================
# CLEARGATE nginx — GPU profile (TLS-terminating reverse proxy)
#
# This file is mounted into the nginx container as a TEMPLATE
# (/etc/nginx/templates/default.conf.template) — nginx:alpine substitutes
# ${CLEARGATE_DOMAIN} and ${CLEARGATE_TLS_MODE} from container env at boot.
#
# Three TLS modes (set via CLEARGATE_TLS_MODE in .env):
#   letsencrypt — certs at /etc/letsencrypt/live/${CLEARGATE_DOMAIN}/
#   corp_ca     — certs at /etc/cleargate-certs/${CLEARGATE_DOMAIN}.{crt,key}
#   selfsigned  — certs at /etc/cleargate-certs/selfsigned.{crt,key}
# install-gpu.sh sets up the right path based on the chosen mode.
# =============================================================================

# Upstream backends — service-name DNS works because nginx is on the same
# Docker network. We declare upstreams so nginx caches the DNS resolution
# (re-resolved on container restart only).
upstream cleargate_backend {
    server backend:8000;
    keepalive 16;
}

upstream cleargate_frontend {
    server frontend:3000;
    keepalive 8;
}

# -- HTTP -> HTTPS redirect, plus Let's Encrypt ACME challenge passthrough --
server {
    listen 80;
    server_name ${CLEARGATE_DOMAIN};

    # Let's Encrypt http-01 challenge. Always allow this even if cert
    # rotation is happening — certbot writes here during renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Internal-network healthcheck (used by docker compose healthcheck).
    # Bypasses TLS so we don't need a valid cert just to confirm nginx is up.
    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Everything else: redirect to HTTPS so users never accidentally
    # send credentials over plaintext.
    location / {
        return 301 https://$host$request_uri;
    }
}

# -- HTTPS — main entry point for lawyers --
server {
    listen 443 ssl;
    http2 on;
    server_name ${CLEARGATE_DOMAIN};

    # Cert path resolved by install-gpu.sh into a symlink at this fixed
    # location, so this conf file doesn't need conditional logic per
    # TLS mode.
    ssl_certificate     /etc/cleargate-certs/active.crt;
    ssl_certificate_key /etc/cleargate-certs/active.key;

    # Modern TLS profile — drops everything older than TLS 1.2, prefers
    # 1.3 ciphers. Aligned with Mozilla's "intermediate" config.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — once a browser has seen us, it should never accept HTTP again.
    # max-age 1 year, applies to subdomains, eligible for preload.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Hardening headers — defense-in-depth, don't break the app.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Default: 50 MB request body. Lawyers upload .docx files which are
    # rarely above 5 MB, but the multipart wrapper plus HTTP/2 padding
    # can puff that up. 50 MB matches the documented frontend limit.
    client_max_body_size 50M;

    # Long-running upstream timeouts: anonymization with deep scan can
    # take 30-90 seconds even on GPU; default 60s would cut us off.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 30s;

    # ----- API routes — proxy to FastAPI backend -----
    location /api/ {
        proxy_pass http://cleargate_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        # Forward cookies (cg_session) without sanitization.
        proxy_pass_request_headers on;
    }

    # ----- WebSocket — for live anonymization streaming -----
    # The /ws/ prefix is what the backend mounts WebSocket routes under
    # (see app/routers/llm_ws.py). Need explicit Upgrade headers.
    location /ws/ {
        proxy_pass http://cleargate_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # WebSocket upgrade dance.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        # WebSocket connections are long-lived; aggressive idle timeouts
        # would kill them mid-stream.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ----- Backend healthcheck — convenience for monitoring -----
    location = /health {
        proxy_pass http://cleargate_backend/health;
        access_log off;
    }

    # ----- Static frontend — everything else -----
    location / {
        proxy_pass http://cleargate_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
